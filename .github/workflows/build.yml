name: Sifa build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Real Android boot on KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Android device and Sifa configuration
        run: |
          printf 'ANDROID_AVD_HOME=%s/sifa-ci-avd\nXDG_CONFIG_HOME=%s/sifa-ci-config\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify actual hardware acceleration
        run: |
          test -c /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install official SDK components using existing runner licenses
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "emulator" "platform-tools" "system-images;android-35;google_apis_playstore;x86_64" < /dev/null
          test -f "$ANDROID_HOME/system-images/android-35/google_apis_playstore/x86_64/system.img"
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Create an isolated fresh Google Play AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME" "$XDG_CONFIG_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name Sifa_CI --package "system-images;android-35;google_apis_playstore;x86_64" --device pixel_2
      - name: Build the actual Sifa runtime
        run: |
          cmake -S . -B build-android -DCMAKE_BUILD_TYPE=Release -DSIFA_BUILD_TESTS=OFF -DBUILD_TESTING=OFF
          cmake --build build-android --target sifa --parallel 2
      - name: Boot real Android and verify its Google Play package
        run: |
          set -o pipefail
          ./build-android/sifa --android smoke Sifa_CI --sdk "$ANDROID_HOME" \
            --headless --gpu software --memory 2048 --cores 2 --width 1280 --height 720 \
            --boot-timeout 300 | tee build-android/android-smoke.json
          python3 - <<'PY'
          import json
          with open('build-android/android-smoke.json') as f:
              result = json.load(f)
          assert result['ok'] and result['boot_completed'] and result['stopped'], result
          assert result['play_store_installed'], result
          PY
      - name: Verify a second real boot with the same authorization identity
        run: |
          set -o pipefail
          ./build-android/sifa --android smoke Sifa_CI --sdk "$ANDROID_HOME" \
            --headless --gpu software --memory 2048 --cores 2 --width 1280 --height 720 \
            --boot-timeout 300 | tee build-android/android-restart.json
          python3 - <<'PY'
          import json
          with open('build-android/android-restart.json') as f:
              result = json.load(f)
          assert result['ok'] and result['boot_completed'] and result['play_store_installed'] and result['stopped'], result
          PY
      - name: Preserve actual Android results without keys or guest images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sifa-real-Android-evidence
          path: |
            build-android/android-smoke.json
            build-android/android-restart.json
          if-no-files-found: ignore
      - name: Report actual Android outcomes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in Path('build-android').glob('android-*.json'):
              result = json.loads(path.read_text())
              summary = json.dumps(result, ensure_ascii=True).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Real Android ' + path.stem + '::' + summary)
          PY

  linux:
    name: Linux source tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check distribution safeguards
        run: python tests/package_tests.py

  windows:
    name: Windows build, Defender scan, and tests
    needs: [linux, android]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build using the documented Windows helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(& cmd.exe /d /c tools\build-windows.cmd 2>&1)
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $output | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) {
            $detail = (($output | Select-Object -Last 12) -join ' | ').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows build failed::$detail"
            exit $buildExit
          }
      - &prepare_hosted_defender
        name: Enable Defender coverage on the disposable hosted runner
        shell: powershell
        run: |
          try {
            if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
              throw 'Automatic Defender preparation is restricted to disposable GitHub-hosted runners.'
            }
            Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop
            $preferences = Get-MpPreference -ErrorAction Stop
            foreach ($field in @('ExclusionPath', 'ExclusionExtension', 'ExclusionProcess')) {
              $values = @($preferences.$field | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
              if ($values.Count -gt 0) {
                $parameters = @{ ErrorAction = 'Stop' }
                $parameters[$field] = $values
                Remove-MpPreference @parameters
              }
            }
            $enabled = $false
            for ($attempt = 0; $attempt -lt 10; $attempt++) {
              if ((Get-MpComputerStatus -ErrorAction Stop).RealTimeProtectionEnabled) {
                $enabled = $true
                break
              }
              Start-Sleep -Seconds 2
            }
            if (-not $enabled) { throw 'The hosted runner did not enable Defender real-time protection.' }
          } catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Defender preparation unavailable::$detail"
            throw
          }
      - &update_defender
        name: Update Defender definitions on the disposable CI runner
        shell: powershell
        run: |
          try {
            Update-MpSignature -ErrorAction Stop
          } catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Defender update unavailable::$detail"
            throw
          }
      - name: Scan all built EXEs before executing them
        shell: powershell
        run: |
          .\tools\scan-windows.ps1 -Path .\build-msvc\Release -ReportPath .\build-msvc\defender-scan.json
      - name: Record Defender diagnostics if validation is blocked
        if: failure()
        shell: powershell
        run: |
          $root = [IO.Path]::GetFullPath('.\build-msvc\Release') + '\'
          $names = @{}
          foreach ($threat in @(Get-MpThreat -ErrorAction Stop)) {
            $names[[string]$threat.ThreatID] = [string]$threat.ThreatName
          }
          $records = @()
          foreach ($detection in @(Get-MpThreatDetection -ErrorAction Stop)) {
            $resources = @($detection.Resources | Where-Object {
              ([string]$_).IndexOf($root, [StringComparison]::OrdinalIgnoreCase) -ge 0
            })
            if ($resources.Count -eq 0) { continue }
            $record = [ordered]@{
              threat_id = [string]$detection.ThreatID
              threat_name = $names[[string]$detection.ThreatID]
              detection_id = [string]$detection.DetectionID
              detected_at = [string]$detection.InitialDetectionTime
              action_success = $detection.ActionSuccess
              resources = $resources
            }
            $records += $record
            $detail = (($record | ConvertTo-Json -Depth 4 -Compress)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Defender detection details::$detail"
          }
          $report = [ordered]@{ result = 'blocked'; detections = $records }
          $null = [IO.Directory]::CreateDirectory('.\build-msvc')
          [IO.File]::WriteAllText([IO.Path]::GetFullPath('.\build-msvc\defender-blocked.json'), ($report | ConvertTo-Json -Depth 6))
      - name: Preserve blocked-scan metadata without executables
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sifa-Defender-diagnostics
          path: build-msvc/defender-blocked.json
          if-no-files-found: ignore
      - name: Run tests only after a successful scan
        run: ctest --test-dir build-msvc -C Release --output-on-failure
      - name: Verify the real Windows desktop and redirected CLI
        shell: powershell
        run: |
          try {
            .\tests\desktop_smoke.ps1 -Exe .\build-msvc\Release\Sifa.exe -OutputDirectory .\build-msvc\desktop-smoke
          } catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Native desktop verification failed::$detail"
            throw
          }
      - name: Preserve native desktop test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sifa-desktop-test-evidence
          path: build-msvc/desktop-smoke/
          if-no-files-found: ignore
      - name: Package the exact scanned executable
        run: >-
          python tools/package_release.py
          --exe build-msvc/Release/Sifa.exe
          --scan-report build-msvc/defender-scan.json
          --output build-msvc/Sifa-Android-integration-preview.zip
      - name: Publish the scanned preview and scan metadata
        uses: actions/upload-artifact@v4
        with:
          name: Sifa-Android-integration-preview
          path: |
            build-msvc/Sifa-Android-integration-preview.zip
            build-msvc/Sifa-Android-integration-preview.zip.sha256
            build-msvc/defender-scan.json
          if-no-files-found: error

  desktop:
    # This independent application check never publishes an executable and does
    # not replace the required full Windows suite or its distribution gate.
    name: Windows application UI evidence only
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build only the application for isolated UI verification
        run: |
          cmake -S . -B build-desktop -G "Visual Studio 17 2022" -A x64 -DSIFA_BUILD_TESTS=OFF -DBUILD_TESTING=OFF
          cmake --build build-desktop --config Release --target sifa --parallel 2
      - *prepare_hosted_defender
      - *update_defender
      - name: Scan the application before running its UI
        shell: powershell
        run: .\tools\scan-windows.ps1 -Path .\build-desktop\Release -ReportPath .\build-desktop\defender-scan.json
      - name: Verify the native application without launching Android
        shell: powershell
        run: |
          try {
            .\tests\desktop_smoke.ps1 -Exe .\build-desktop\Release\Sifa.exe -OutputDirectory .\build-desktop\desktop-smoke
          } catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Isolated desktop verification failed::$detail"
            throw
          }
      - name: Save application test evidence without executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sifa-isolated-desktop-evidence
          path: |
            build-desktop/desktop-smoke/
            build-desktop/defender-scan.json
          if-no-files-found: ignore
